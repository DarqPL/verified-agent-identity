name: Verify Human Identity 1

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'hong123'
        required: true
        default: 'hong123'
      agent_description:
        description: 'hong123'
        required: true
        default: 'finder AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Cài đặt Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Bước 1 - Cài đặt ClawHub
        run: npx clawhub@latest install verified-agent-identity || (echo "Retrying in 30s due to rate limiting..."; sleep 30; npx clawhub@latest install verified-agent-identity)

      - name: Cài đặt các thư viện cần thiết
        run: |
          cd scripts
          npm install

      - name: Bước 2 - Tạo Ethereum Identity mới
        run: node scripts/createNewEthereumIdentity.js

      - name: Bước 3 - Xem link xác minh Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name": "hong123", "description": "hong123 AI Agent"}'
